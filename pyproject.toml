[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feln"
version = "0.1.1"
description = "FELN queries over a layers-json catalog: model, compare, DuckDB SQL, and a generate CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "sqlglot>=26",
    "numpy>=2",
    # Commit-pinned so a clean checkout resolves the same tree anywhere, rather than
    # assuming this machine's layout. The repo is public (0.4.2, 2026-09-15); no
    # credentials needed. Bump the rev when layers-json lands a change this package
    # needs; for local cross-repo work, shadow it with `uv pip install -e ../layers-json`
    # after syncing.
    "layers-json[model] @ git+https://github.com/mraad/layers-json.git@32d6d4ea57975a05552f2ade840cf2085ff25ed1",
]

[project.optional-dependencies]
dev = ["ruff>=0.16", "pytest>=9"]

[project.scripts]
feln = "feln.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["feln"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "N801"]

[tool.pytest.ini_options]
testpaths = ["tests"]
